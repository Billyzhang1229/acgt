[project]
name = "acgt"
version = "0.0.1"
description = "Open source, open read: vectorized personal genomics, agent-ready, private by architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "zarr",
    "numcodecs",
    "numpy",
    "xarray",
    "textual",
    "bio2zarr",
    "cyvcf2",
]

[project.scripts]
acgt = "acgt.tui:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "import-linter",
    "vcztools",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package sits flat at the repository root, not under src/.
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "C4", "RUF", "NPY", "PT", "A", "SIM"]
