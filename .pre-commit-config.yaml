# These revs pin ruff and ty separately from uv.lock — keep them matched to
# the versions there when bumping either side. Checks only — nothing rewrites
# files; fix and re-stage yourself.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-case-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.70
    hooks:
      - id: ty
