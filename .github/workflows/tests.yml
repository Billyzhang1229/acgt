name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a run when a newer push to the same branch supersedes it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # ty resolves imports against the project venv, so the hooks need a
      # synced environment even though ruff does not.
      - name: Install dependencies
        run: uv sync --locked

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: pre-commit/action@v3.0.1

  tests:
    strategy:
      fail-fast: false
      matrix:
        # No Windows: cyvcf2 builds on htslib, which has no Windows wheels.
        os: [ubuntu-latest, macos-latest]
        # Every version requires-python in pyproject.toml admits.
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest --cov=acgt --cov-report=term-missing --cov-report=xml

      # Every matrix job uploads; Codecov merges reports for the same commit.
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
